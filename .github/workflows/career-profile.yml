name: Validate career profile

on:
  push:
    paths:
      - 'career-profile/**'
      - '.github/workflows/career-profile.yml'
  pull_request:
    paths:
      - 'career-profile/**'
      - '.github/workflows/career-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r career-profile/requirements.txt
      - run: python career-profile/scripts/profile.py validate --check-export
      - run: python -m unittest discover -s career-profile/tests
